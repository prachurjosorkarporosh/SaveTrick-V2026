name: Build APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare Keystore and Config
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env
          if [ ! -f "google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0"},"api_key":[{}]}]}' > app/google-services.json || true
          fi

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Organize APK Files
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output-apk/ \;
          ls -la output-apk/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-APKs
          path: output-apk/*.apk
          retention-days: 14

      - name: Publish GitHub Release (with APKs)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SaveTrick Build #${{ github.run_number }}
          body: |
            ### 📱 SaveTrick Android APK
            স্বয়ংক্রিয়ভাবে তৈরি হওয়া APK ফাইল নিচে সংযুক্ত রয়েছে:
            - **Release APK**: প্রোডাকশন রিলিজ
            - **Debug APK**: টেস্টিংয়ের জন্য
          files: output-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
