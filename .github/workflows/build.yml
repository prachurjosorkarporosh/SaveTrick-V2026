name: Build SaveTrick Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Generate APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Rename and Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifacts/SaveTrick-debug.apk \;
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/SaveTrick-release-unsigned.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-Debug-APK
          path: artifacts/SaveTrick-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-Release-APK
          path: artifacts/SaveTrick-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 14
