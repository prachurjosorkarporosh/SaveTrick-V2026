name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK (Java 21 for AGP 9.1 & Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Accept Android SDK Licenses & Prepare Tools
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: 5. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: 6. Prepare Keystore & Dependencies
        run: |
          # Create debug.keystore if base64 exists or generate fresh debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

          # Ensure .env and .env.example files exist to satisfy Secrets Gradle Plugin
          touch .env
          touch .env.example
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Setup google-services.json
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            mkdir -p app
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"1234567890","project_id":"savetrick-app-2026","storage_bucket":"savetrick-app-2026.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:b2a9e34c9f187a02c3d4e5","android_client_info":{"package_name":"com.prachurjo.savetrick.app"}},"api_key":[{"current_key":"dummy_key"}]}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: 7. Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: 8. Build Debug APK
        run: |
          echo "Starting APK Build..."
          # Select gradlew if wrapper jar is present, otherwise fallback to system gradle
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            BUILD_RUNNER="./gradlew"
          else
            BUILD_RUNNER="gradle"
          fi

          echo "Using runner: $BUILD_RUNNER"
          $BUILD_RUNNER :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -x test \
            -x lint \
            -x lintVitalRelease \
            -x verifyRoborazziDebug

      - name: 9. Verify and Copy APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | grep -v "build-output" | head -n 1)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/SaveTrick-debug.apk
            echo "✅ Successfully located APK at $APK_PATH and saved to build-output/SaveTrick-debug.apk"
          else
            echo "❌ Failed to locate generated APK"
            find . -name "*.apk" || true
            exit 1
          fi
          ls -lh build-output/

      - name: 10. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-APK
          path: build-output/SaveTrick-debug.apk
          retention-days: 14

      - name: 11. Auto-create GitHub Release (Direct Download)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.7-build-${{ github.run_number }}
          name: SaveTrick v2.5.7 (Build ${{ github.run_number }})
          body: |
            ### 📲 SaveTrick Android APK
            স্বয়ংক্রিয়ভাবে তৈরি হওয়া **Debug APK** নিচে সংযুক্ত করা হয়েছে।
          files: build-output/SaveTrick-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
