name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK (Java 21 for AGP 9.1 & Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: 5. Prepare Keystore & Dependencies
        run: |
          # Create debug.keystore if base64 exists or generate fresh debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Secrets dummy file to satisfy buildConfig
          touch .env

          # Fallback google-services.json
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0"},"api_key":[{}]}]}' > app/google-services.json || true
          fi

          # Accept SDK licenses
          yes | sdkmanager --licenses || true

      - name: 6. Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: 7. Build Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: 8. Verify APK Generation
        run: |
          mkdir -p build-output
          cp $(find app/build/outputs/apk/debug -name "*.apk" | head -n 1) build-output/SaveTrick-debug.apk || cp app/build/outputs/apk/debug/*.apk build-output/ || true
          ls -lh build-output/

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-APK
          path: build-output/*.apk
          retention-days: 14

      - name: 10. Auto-create GitHub Release (Direct Download)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.7-build-${{ github.run_number }}
          name: SaveTrick v2.5.7 (Build ${{ github.run_number }})
          body: |
            ### 📲 SaveTrick Android APK
            স্বয়ংক্রিয়ভাবে তৈরি হওয়া **Debug APK** নিচে সংযুক্ত করা হয়েছে।
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
