name: Build & Package Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🚀 Build SaveTrick APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: 5. Environment and Secrets Setup
        run: |
          # 1. Create debug keystore if not found
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=SaveTrick,C=US"
          fi

          # 2. Touch .env and .env.example for Secrets Gradle Plugin
          touch .env
          echo "GEMINI_API_KEY=" > .env
          touch .env.example
          echo "GEMINI_API_KEY=" > .env.example

          # 3. Create fallback google-services.json if absent
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"68919931706","project_id":"savetrick-app-2026"},"client":[{"client_info":{"mobilesdk_app_id":"1:68919931706:android:b2a9e34c9f187a02c3d4e5"},"api_key":[{"current_key":"AIzaSyDummyKeyForFirebaseBuildValidation2026"}]}]}' > app/google-services.json
          fi

          # 4. Accept Android SDK licenses
          yes | sdkmanager --licenses || true

      - name: 6. Make Gradlew Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: 7. Build Debug & Release APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=4 \
            --stacktrace

      - name: 8. Prepare and Name Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SaveTrick-v2.5.7-debug.apk
          fi
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/SaveTrick-v2.5.7-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/SaveTrick-v2.5.7-release.apk
          fi
          echo "=== Ready Artifacts ==="
          ls -la build-artifacts/

      - name: 9. Upload SaveTrick APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-APKs
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
