name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: 5. Prepare Keystore and Configurations
        run: |
          # 1. Create debug keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 2. Touch .env for Secrets Gradle Plugin
          touch .env
          echo "DUMMY_KEY=true" > .env

          # 3. Create dummy google-services.json for Google Services Plugin
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"0","project_id":"dummy-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0"},"api_key":[{}]}]}' > app/google-services.json
          fi

          # 4. Accept Android SDK licenses
          yes | sdkmanager --licenses || true

      - name: 6. Make Gradlew Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: 7. Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: 8. Verify APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -name "*.apk" -print

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveTrick-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
